name: Attach stable asset to release
on:
  release:
    types: [published, edited]

jobs:
  upload-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ensures tags/metadata are present

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install production dependencies only
        run: |
          npm ci --production

      # Create a clean tarball with a top-level folder "designer/"
      - name: Build tarball
        run: |
          mkdir -p out/designer node_modules
          cp -r dist package.json server.js node_modules out/designer/
          tar -czf designer.tar.gz -C out designer

      # Upload as the stable-named asset
      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: designer.tar.gz
          overwrite: true
