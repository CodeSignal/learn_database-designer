<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DB Schema Designer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>DB Schema Designer</h1>
    <button id="btn-save-solution">Save solution</button>
    <div id="status">Ready</div>
    <button id="btn-help" class="as-button ghost">Help</button>
  </header>

  <main class="layout">
    <!-- Diagram -->
    <div id="diagram-wrap">
      <svg id="diagram" width="100%" height="100%" viewBox="0 0 1400 900"></svg>
      <button id="btn-new-table" class="as-button canvas-fab" type="button" title="New table" aria-label="New table">+</button>
    </div>
  </main>

  <!-- Table pop-up (create from the "+" button in the canvas corner, or edit from the table toolbar) -->
  <dialog id="table-dialog" class="field-dialog">
    <form id="table-dialog-form">
      <h3 id="td-title">New table</h3>
      <label>Table name
        <input id="td-name" required placeholder="users" />
      </label>
      <fieldset class="color-choices">
        <legend>Color</legend>
        <label class="color-choice"><input type="radio" name="td-color" value="white" checked /><span class="swatch" style="background:var(--tbl-white)"></span>White</label>
        <label class="color-choice"><input type="radio" name="td-color" value="blue" /><span class="swatch" style="background:var(--tbl-blue)"></span>Blue</label>
        <label class="color-choice"><input type="radio" name="td-color" value="green" /><span class="swatch" style="background:var(--tbl-green)"></span>Green</label>
        <label class="color-choice"><input type="radio" name="td-color" value="red" /><span class="swatch" style="background:var(--tbl-red)"></span>Red</label>
      </fieldset>
      <div class="row dialog-actions">
        <button type="button" id="td-cancel" class="as-button ghost">Cancel</button>
        <button type="submit" id="td-submit">Create Table</button>
      </div>
    </form>
  </dialog>

  <!-- Field pop-up (opened from the "+ Add field" row or a field's edit button) -->
  <dialog id="field-dialog" class="field-dialog">
    <form id="field-dialog-form">
      <h3 id="fd-title">Add field</h3>
      <label>Column name
        <input id="fd-name" required placeholder="id" />
      </label>
      <label>Type
        <select id="fd-type"></select>
      </label>
      <label class="row">
        <input type="checkbox" id="fd-nullable" /> Nullable
      </label>
      <label>Default
        <input id="fd-default" placeholder="NULL or value" />
      </label>
      <label class="row">
        <input type="checkbox" id="fd-pk" /> Primary key
      </label>
      <label class="row">
        <input type="checkbox" id="fd-unique" /> Unique
      </label>
      <div class="row dialog-actions">
        <button type="button" id="fd-cancel" class="as-button ghost">Cancel</button>
        <button type="submit" id="fd-submit">Add Field</button>
      </div>
    </form>
  </dialog>

  <!-- Foreign key pop-up (opened from a selected field's link button) -->
  <dialog id="fk-dialog" class="field-dialog">
    <form id="fk-dialog-form">
      <h3 id="fkd-title">Foreign key</h3>
      <p id="fkd-current" class="dialog-note" hidden></p>
      <label id="fkd-key-wrap" hidden>Key
        <select id="fkd-key"></select>
      </label>
      <label>To table
        <select id="fkd-to-table" required></select>
      </label>
      <label>To column
        <select id="fkd-to-col" required></select>
      </label>
      <label>On Delete
        <select id="fkd-ondelete">
          <option>NO ACTION</option><option>CASCADE</option>
          <option>SET NULL</option><option>RESTRICT</option>
        </select>
      </label>
      <div class="row dialog-actions">
        <button type="button" id="fkd-remove" class="danger" hidden>Remove FK</button>
        <span class="spacer"></span>
        <button type="button" id="fkd-cancel" class="as-button ghost">Cancel</button>
        <button type="submit" id="fkd-submit">Add FK</button>
      </div>
    </form>
  </dialog>

  <script src="./io.js"></script>
  <script src="./diagram.js"></script>
  <script src="./ui.js"></script>
  <script src="./help-modal.js"></script>
  <script src="./app.js"></script>
</body>
</html>
